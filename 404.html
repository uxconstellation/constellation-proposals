<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost in space | Constellation</title>
  <link rel="icon" type="image/svg+xml" href="/constellation-proposals/favicon.svg" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #173F3F; --orange: #FE6E36; --off-white: #F6F4EF;
      --display: 'Noken', 'Satoshi', 'Inter', system-ui, sans-serif;
      --body: 'Satoshi', 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--body); background: var(--teal); color: var(--off-white);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 32px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--orange); margin-bottom: 16px; }
    h1 { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 10vw, 88px); line-height: 1; letter-spacing: -0.02em; color: #fff; margin-bottom: 16px; }
    p { color: rgba(246,244,239,0.78); max-width: 44ch; margin: 0 auto 24px; font-size: 18px; }
    a { display: inline-block; background: var(--orange); color: #1B1C21; font-weight: 700; text-decoration: none; padding: 14px 28px; border-radius: 999px; }
    a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Constellation</p>
    <h1>404</h1>
    <p>This page drifted out of orbit. Let us get you back to a fixed point.</p>
    <a href="/constellation-proposals/">Back to proposals</a>
  </main>
</body>
</html>
