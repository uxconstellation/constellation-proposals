<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constellation Proposals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FE6E36;
      --dark: #0D0D0D;
      --mid: #1A1A1A;
      --white: #FFFFFF;
      --text-light: rgba(255,255,255,0.55);
    }
    body {
      background: var(--dark);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 3rem;
    }
    .logo span { color: var(--orange); }
    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 1rem;
    }
    p {
      color: var(--text-light);
      font-size: 1rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 3rem;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: var(--orange);
      margin: 0 auto 3rem;
    }
    .footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.75rem;
      color: var(--text-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="logo">Constellation <span>·</span> Proposals</div>
  <h1>Client Proposals</h1>
  <div class="divider"></div>
  <p>This is a restricted area. Proposals are shared directly with clients via unique links. If you have received a proposal link, please use that link to access your document.</p>
  <div class="footer">proposals.uxconstellation.com</div>
</body>
</html>
